name: Atualizar resultados da Lotofácil

on:
  schedule:
    # Sorteios de segunda a sábado às 20h (Brasília). Roda às 23h40 e de novo às 9h10 (Brasília) do dia seguinte.
    - cron: "40 2 * * 0,2-6"
    - cron: "10 12 * * 0,2-6"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar concursos novos
        run: python scripts/atualizar_resultados.py
      - name: Salvar no repositório
        run: |
          if git diff --quiet resultados.json; then
            echo "Nenhum concurso novo."
          else
            git config user.name "atualizador-lotofacil"
            git config user.email "actions@users.noreply.github.com"
            git add resultados.json
            git commit -m "Resultados atualizados"
            git push
          fi
